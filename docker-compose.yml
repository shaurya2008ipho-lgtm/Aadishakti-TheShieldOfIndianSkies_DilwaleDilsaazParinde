services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aadishakti
      POSTGRES_USER: aadi
      POSTGRES_PASSWORD: aadi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
